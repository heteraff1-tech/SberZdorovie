name: QA Loop

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Check preinstalled Chrome
        run: google-chrome --version
      - name: Run full QA
        run: npm run qa
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qa-traces
          path: app/test-results/
          retention-days: 7
